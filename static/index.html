<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FindBreed</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    font-family: "Malgun Gothic", system-ui, sans-serif;
    background: #f3f5f7; color: #1a1e26; line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: #6b7480; font-size: 14px; margin: 0 0 28px; }

  .drop {
    display: block;
    background: #fff; border: 2px dashed #c8cfd8; border-radius: 8px;
    padding: 44px 20px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: #2f7d5f; background: #f2f9f6; }
  .drop p { margin: 0; color: #6b7480; }
  input[type=file] { display: none; }

  .panel { display: none; margin-top: 28px; gap: 24px; }
  .panel.show { display: grid; grid-template-columns: 300px 1fr; }
  @media (max-width: 700px) { .panel.show { grid-template-columns: 1fr; } }

  .photo { width: 100%; border-radius: 8px; background: #fff; }

  .card { background: #fff; border-radius: 8px; padding: 20px; }
  .meta { font-size: 13px; color: #6b7480; margin-bottom: 14px; }
  .warn {
    background: #fdf0e8; color: #a2461d; padding: 10px 12px;
    border-radius: 6px; font-size: 14px; margin-bottom: 16px;
  }

  .row { margin-bottom: 14px; }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; }
  .row .name { font-size: 15px; }
  .row .pct { font-family: Consolas, monospace; font-weight: 700; color: #2f7d5f; }
  .bar { height: 8px; background: #e9eeeb; border-radius: 4px; margin-top: 5px; }
  .bar span { display: block; height: 100%; background: #2f7d5f; border-radius: 4px; }

  .loading { display: none; margin-top: 28px; color: #6b7480; }
  .loading.show { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <h1>FindBreed</h1>
  <p class="sub">사진 속 강아지가 어떤 견종과 닮았는지 추정합니다. DNA 혈통 비율이 아닙니다.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <p>사진을 끌어다 놓거나 클릭해서 선택하세요</p>
  </label>

  <div class="loading" id="loading">분석 중...</div>

  <div class="panel" id="panel">
    <img class="photo" id="preview" alt="">
    <div class="card" id="result"></div>
  </div>

</div>

<script>
const drop    = document.getElementById('drop');
const fileEl  = document.getElementById('file');
const panel   = document.getElementById('panel');
const preview = document.getElementById('preview');
const result  = document.getElementById('result');
const loading = document.getElementById('loading');

// 끌어다 놓기. preventDefault를 안 하면 브라우저가 사진을 새 탭에서 열어버린다.
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  if (e.dataTransfer.files.length) send(e.dataTransfer.files[0]);
});

fileEl.addEventListener('change', () => {
  if (fileEl.files.length) send(fileEl.files[0]);
});

async function send(file) {
  preview.src = URL.createObjectURL(file);   // 서버 응답 전에 미리 보여준다
  panel.classList.remove('show');
  loading.classList.add('show');

  const form = new FormData();
  form.append('file', file);                 // 이름이 app.py의 file 인자와 같아야 한다

  try {
    const res = await fetch('/predict', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '오류가 발생했습니다');
    render(data);
  } catch (err) {
    result.innerHTML = `<div class="warn">${err.message}</div>`;
    panel.classList.add('show');
  } finally {
    loading.classList.remove('show');
  }
}

function render(d) {
  const top = d.topk;
  const widest = Math.max(...top.map(t => t.percent));

  let html = `<div class="meta">
    개 검출 ${d.dog_detected ? '성공 (' + d.detect_confidence + ')' : '실패 — 사진 전체로 추론'}
     &middot; 최고 유사도 ${d.max_similarity}
  </div>`;

  if (d.unknown) {
    html += `<div class="warn">
      아는 견종과 뚜렷하게 닮지 않았습니다. 믹스견일 수 있으며, 아래 순위는 참고용입니다.
    </div>`;
  }

  // 1등을 100%로 놓은 상대 길이 — 분포가 뾰족한지 평평한지 한눈에 보인다
  for (const t of top) {
    const w = (t.percent / widest * 100).toFixed(1);
    html += `<div class="row">
      <div class="top">
        <span class="name">${t.breed.replace(/_/g, ' ')}</span>
        <span class="pct">${t.percent}%</span>
      </div>
      <div class="bar"><span style="width:${w}%"></span></div>
    </div>`;
  }

  const other = 100 - top.reduce((s, t) => s + t.percent, 0);
  if (other > 0.1) html += `<div class="meta">나머지 ${other.toFixed(1)}%</div>`;

  result.innerHTML = html;
  panel.classList.add('show');
}
</script>
</body>
</html>
